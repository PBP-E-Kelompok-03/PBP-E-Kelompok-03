{% extends "base.html" %}

{% block title %}{{ title }} — Dibuang Sayang{% endblock %}

{% block content %}
<a href="{% if restaurant %}{% url 'food:restaurant_detail' restaurant.id %}{% else %}{% url 'food:list' %}{% endif %}" style="display: inline-block; margin-bottom: var(--space-md); text-decoration: none;">
  ← Kembali
</a>

<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2 style="margin-top: 0;">{{ title }}</h2>

  <form method="post">
    {% csrf_token %}

    {% for field in form %}
      <div class="form-field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div style="color: var(--color-danger); font-size: var(--font-size-sm); margin-top: 4px;">
            {{ field.errors.0 }}
          </div>
        {% endif %}
      </div>
    {% endfor %}

    <div style="display: flex; gap: var(--space-sm); margin-top: var(--space-lg);">
      <button type="submit" class="btn">Simpan Restoran</button>
      <a href="{% url 'food:list' %}" class="btn btn--outline">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
